# Network edition: marketplace home, a member store, a product, search, a bookable service and
# its booking, map, cart, then signed in: account, orders, an order and checkout.
appId: ${APP_ID}
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
      visible:
          id: store-card
      timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-network-details${SHOT_SUFFIX}

- tapOn:
      id: store-card
      index: 0
- extendedWaitUntil:
      visible:
          id: product-item
      timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-store-details-network${SHOT_SUFFIX}

- tapOn:
      id: product-item
      index: 0
- extendedWaitUntil:
      visible:
          id: product-add-to-cart
      timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-product-details-network${SHOT_SUFFIX}
# A product with a required option (e.g. a size) can't be added until one is chosen.
- tapOn:
      id: product-option-required
      index: 0
      optional: true
- tapOn:
      id: product-add-to-cart
- waitForAnimationToEnd
# Adding closes the product; if it didn't (e.g. a second required group), close it.
- tapOn:
      id: product-close
      optional: true

- tapOn:
      id: tab-network-search
- tapOn:
      id: network-search-input
- inputText: ${SEARCH_QUERY}
- hideKeyboard
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-products-list-network${SHOT_SUFFIX}

# A bookable service: its page, then a day and a time picked. The second open day is always
# ahead of now, so it has times left whatever the hour of the run.
- tapOn:
      id: network-search-input
- eraseText
- inputText: ${SERVICE_QUERY}
- hideKeyboard
- extendedWaitUntil:
      visible:
          id: search-result-service
      timeout: 30000
- tapOn:
      id: search-result-service
      index: 0
- extendedWaitUntil:
      visible:
          id: product-add-to-cart
      timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-service-details-network${SHOT_SUFFIX}
- scrollUntilVisible:
      element:
          id: booking-day
      direction: DOWN
- tapOn:
      id: booking-day
      index: 1
# Scroll only until a time shows, so the service's photo and name stay in the frame.
- scrollUntilVisible:
      element:
          id: booking-time
      direction: DOWN
- tapOn:
      id: booking-time
      index: 1
- waitForAnimationToEnd
- takeScreenshot: storefront-app-booking-create-network${SHOT_SUFFIX}
- tapOn:
      id: product-close

- tapOn:
      id: tab-network-map
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-stores-map-network${SHOT_SUFFIX}

- tapOn:
      id: tab-network-cart
- extendedWaitUntil:
      visible:
          id: cart-checkout
      timeout: 30000
- takeScreenshot: storefront-app-cart-details-network${SHOT_SUFFIX}

- tapOn:
      id: tab-network-profile
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
      visible:
          id: account-orders
      timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-account-details-network${SHOT_SUFFIX}

- tapOn:
      id: account-orders
# The review customer has an order in progress in both editions (past orders may not exist).
- extendedWaitUntil:
      visible:
          id: order-active
      timeout: 30000
- takeScreenshot: storefront-app-orders-list-network${SHOT_SUFFIX}
- tapOn:
      id: order-active
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-order-details-network${SHOT_SUFFIX}

# The order screen can sit over the tab bar on Android; step back to a tab first.
- runFlow:
      when:
          platform: Android
          notVisible:
              id: tab-network-cart
      commands:
          - back
- tapOn:
      id: tab-network-cart
- extendedWaitUntil:
      visible:
          id: cart-checkout
      timeout: 30000
- tapOn:
      id: cart-checkout
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-checkout-create-network${SHOT_SUFFIX}
