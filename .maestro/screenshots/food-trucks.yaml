# Food trucks home (a build with HOME_SCREEN=foodTrucks): the live map, the list,
# a truck's menu and the trucks search. The same flow captures a Network's trucks (a network
# key with HOME_SCREEN=foodTrucks) with QUALIFIER=-network and SEARCH_TAB=tab-network-search.
appId: ${APP_ID}
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
      visible:
          id: trucks-mode-map
      timeout: 60000
- extendedWaitUntil:
      visible:
          id: nearby-truck
      timeout: 60000
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-food-trucks-map${QUALIFIER}${SHOT_SUFFIX}

- tapOn:
      id: trucks-mode-list
- waitForAnimationToEnd
- takeScreenshot: storefront-app-food-trucks-list${QUALIFIER}${SHOT_SUFFIX}

- tapOn:
      id: nearby-truck
      index: 0
- extendedWaitUntil:
      visible:
          id: product-item
      timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: storefront-app-food-truck-details${QUALIFIER}${SHOT_SUFFIX}

- tapOn:
      id: ${SEARCH_TAB}
- tapOn:
      id: trucks-search-input
- inputText: ${SEARCH_QUERY}
- hideKeyboard
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: storefront-app-products-list-food-trucks${QUALIFIER}${SHOT_SUFFIX}
