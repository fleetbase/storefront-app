name: Storefront App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The GITHUB_TOKEN only needs read here (pull requests: for the changed-files check).
permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels its previous run; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YARN_ENABLE_INLINE_BUILDS: 1
  FLEETBASE_KEY: ${{ secrets.FLEETBASE_KEY }}
  STOREFRONT_KEY: ${{ secrets.STOREFRONT_KEY }}
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  install_and_test:
    runs-on: ubuntu-latest
    outputs:
      # The native builds are debug builds, which don't bundle the JavaScript: a pull request
      # that changes nothing native can't break them, so they're skipped. main always builds.
      native: ${{ github.event_name != 'pull_request' || steps.changes.outputs.native == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect native changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
              - 'brand/**'
              - 'patches/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'yarn.lock'
              - 'react-native.config.js'
              - '.github/workflows/react-native-ci.yml'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 3.6.4
        run: corepack prepare yarn@3.6.4 --activate

      - name: Verify Yarn version
        run: yarn --version

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Create .env file
        run: |
          echo "APP_LINK_PREFIX=${{ secrets.APP_LINK_PREFIX }}" > .env
          echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
          echo "STOREFRONT_KEY=${{ secrets.STOREFRONT_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env

      - name: Lint Network edition runtime and UI
        run: yarn lint:strict

      - name: Type-check strict modules
        run: yarn typecheck:strict

      - name: Run behavior tests
        run: yarn test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build production web bundle
        run: yarn web:build

  android_build:
    runs-on: ubuntu-latest
    needs: install_and_test
    if: needs.install_and_test.outputs.native == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 3.6.4
        run: corepack prepare yarn@3.6.4 --activate

      - name: Verify Yarn version
        run: yarn --version

      # Only Yarn's downloads are cached; node_modules is installed fresh, so patches always
      # apply to a clean copy and native build output never ends up in the cache.
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Create .env file
        run: |
          echo "APP_LINK_PREFIX=${{ secrets.APP_LINK_PREFIX }}" > .env
          echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
          echo "STOREFRONT_KEY=${{ secrets.STOREFRONT_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env

      - name: Generate google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Ninja (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Ensure Android SDK/NDK/CMake toolchain
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e

          # Find a working sdkmanager (latest if present, else first found)
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR=$(ls -1d "$ANDROID_SDK_ROOT/cmdline-tools"/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
            if [ -z "$SDKMGR" ]; then
              echo "No cmdline-tools found; installing 'cmdline-tools;latest' with the preinstalled sdkmanager..."
              # Use the prebundled sdkmanager path on GH runners
              SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
              "$SDKMGR" "cmdline-tools;latest"
              SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          echo "Using sdkmanager at: $SDKMGR"

          # Accept licenses; don't fail on SIGPIPE from 'yes'
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

          # Helper: install component if missing
          need() {
            local p="$1"
            if ! "$SDKMGR" --list_installed | grep -q "^  $p$"; then
              echo "Installing $p"
              "$SDKMGR" "$p"
            else
              echo "✓ $p already installed"
            fi
          }

          # Match root gradle pins
          need "platforms;android-35"
          need "build-tools;35.0.0"
          need "ndk;27.1.12297006"

          # CMake version
          need "cmake;3.22.1"

          # Sanity output
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version || true
          test -f "$ANDROID_SDK_ROOT/ndk/27.1.12297006/source.properties" && echo "✅ NDK 27.1.12297006 installed"

      # Caches the wrapper and dependencies, prunes stale entries, and only saves from main,
      # so pull requests don't each add a multi-gigabyte cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: cd android && chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          # One ABI is enough to prove the native code builds; the default is all four.
          ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios_build:
    runs-on: macos-latest
    needs: install_and_test
    if: needs.install_and_test.outputs.native == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 3.6.4
        run: corepack prepare yarn@3.6.4 --activate

      # Only Yarn's downloads are cached; node_modules is installed fresh, so patches always
      # apply to a clean copy and native build output never ends up in the cache.
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Create .env file
        run: |
          echo "APP_LINK_PREFIX=${{ secrets.APP_LINK_PREFIX }}" > .env
          echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
          echo "STOREFRONT_KEY=${{ secrets.STOREFRONT_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env

      # No CocoaPods cache: restoring it (about 2 GB) took 60 to 96 minutes on the macOS
      # runners, while a fresh pod install takes 15 to 30.
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          bash scripts/ci/install-cocoapods.sh

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone

      - name: Build iOS app for simulator
        run: |
          cd ios

          # Try to find an available iPhone simulator
          AVAILABLE_SIMULATORS=$(xcrun simctl list devices available | grep "iPhone" | head -5)
          echo "Available iPhone simulators:"
          echo "$AVAILABLE_SIMULATORS"

          # Extract the first iPhone simulator ID
          SIMULATOR_ID=$(echo "$AVAILABLE_SIMULATORS" | head -1 | grep -o '[A-F0-9-]\{36\}' | head -1)

          if [ -n "$SIMULATOR_ID" ]; then
              echo "Using iPhone simulator ID: $SIMULATOR_ID"
              DESTINATION="id=$SIMULATOR_ID"
          else
              echo "No iPhone simulator found, trying generic iOS Simulator destination"
              DESTINATION="generic/platform=iOS Simulator"
          fi

          echo "Building with destination: $DESTINATION"

          xcodebuild -workspace StorefrontApp.xcworkspace \
            -scheme StorefrontApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            build

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios/build/Build/Products/Debug-iphonesimulator/
          retention-days: 30
