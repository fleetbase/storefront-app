        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title><%= htmlWebpackPlugin.options.title %></title>
        <link rel="stylesheet" href="global.css" />
        <link rel="stylesheet" href="tamagui.css" />
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
